name: Scrape menu
run-name: "🍽️ Menus · ${{ inputs.urls || 'Swiggy JSON upload' }}"

on:
  # Run from the Actions tab: Actions → Scrape menu → Run workflow
  workflow_dispatch:
    inputs:
      urls:
        description: '🔗 Paste Zomato restaurant links, comma separated (website links or Share links from the app). Swiggy links only work from the double-click launcher on your computer.'
        required: true
  # Or upload a Swiggy menu file (saved with the "Get Swiggy Menu" bookmark) into swiggy-json/
  push:
    paths:
      - 'swiggy-json/**.json'

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape menus
        working-directory: output
        env:
          URLS: ${{ inputs.urls }}
        run: |
          targets="$URLS"
          if [ -z "$targets" ]; then
            # Push trigger: the Swiggy JSON files added or changed by this push
            targets=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- '../swiggy-json/*.json' | sed 's|^|../|' | paste -sd, -)
          fi
          if [ -z "$targets" ]; then
            echo "No new menu files in this push, nothing to do."
            echo "NOTHING=1" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Scraping: $targets"
          # Keep going if some links fail, so the files that worked are still uploaded
          python ../menu_scraper.py "$targets" || echo "::warning::Some links failed, see the log above"

      - name: Set download name
        if: always() && env.NOTHING != '1'
        run: echo "TODAY=$(date +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Upload spreadsheets
        if: env.NOTHING != '1'
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: menus-${{ env.TODAY }}
          path: output/*.xlsx
          if-no-files-found: error

      # After the upload, so the page can link straight to the zip download
      - name: Build results page
        if: always() && env.NOTHING != '1'
        env:
          DOWNLOAD_URL: ${{ steps.upload.outputs.artifact-url }}
        run: python summary.py output "$DOWNLOAD_URL" >> "$GITHUB_STEP_SUMMARY"
